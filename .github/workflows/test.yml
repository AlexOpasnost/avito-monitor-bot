name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel any in-flight run for the same branch when a new push comes in.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        # Matches the Dockerfile (production runs python:3.13-slim).
        # cloudscraper had import issues on early 3.12 betas; current
        # versions install and run cleanly on 3.13. Keep this in sync
        # with Dockerfile's FROM line.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline unit tests
        # test_unit.py stubs env vars (BOT_TOKEN, DATABASE_URL) and runs
        # without network — no Postgres / Telegram / proxy needed in CI.
        run: python test_unit.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"

  security:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Don't block merges on advisories that have no fix yet — surface
    # them in the workflow output for triage. Tighten to required-pass
    # once the dep tree is consistently clean.
    continue-on-error: true

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (dependency CVEs)
        # Audits requirements.txt against PyPI's vulnerability DB.
        # New CVE on a pinned dep → CI starts surfacing it; bump the
        # pin in a follow-up PR (don't auto-bump — supply chain).
        run: pip-audit -r requirements.txt --strict || true

      - name: bandit (Python source SAST)
        # Skips test_unit.py (intentionally exercises edge cases that
        # bandit flags as suspicious patterns).
        run: bandit -r . -x ./test_unit.py,./test_parser.py -ll || true
