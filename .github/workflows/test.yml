name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel any in-flight run for the same branch when a new push comes in.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # Matches the Dockerfile: cloudscraper breaks on 3.12+.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline unit tests
        # test_unit.py stubs env vars (BOT_TOKEN, DATABASE_URL) and runs
        # without network — no Postgres / Telegram / proxy needed in CI.
        run: python test_unit.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
